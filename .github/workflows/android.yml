name: Android APK

# Builds the Android app in the cloud: nothing to install on your computer.
# Run it from the Actions tab (Run workflow); the APK is under the run's "Artifacts".
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # GitHub's Ubuntu runners come with an NDK; ANDROID_NDK_HOME points at it.
      - name: Build the Rust library
        run: tools/android/build-rust.sh release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # A debug APK is signed with a debug key: installable on your own phone, not for a store.
      - name: Build the app
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mister-download-manager-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
